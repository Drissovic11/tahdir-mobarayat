name: Laravel and MySQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password-only
          MYSQL_DATABASE: tahdir_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-password-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tahdir_test
      DB_USERNAME: root
      DB_PASSWORD: test-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, exif
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: find app routes database config -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan migrate --force && php artisan db:seed --force
      - run: php artisan test
      - run: php artisan filament:assets
      - uses: actions/upload-artifact@v4
        with:
          name: backend-composer-lock
          path: backend/composer.lock
